# docker-compose.yml — konveniensi PENGEMBANGAN (docs/15 §2). Bukan artefak deployment produksi.
# postgres/redis/mailpit selalu jalan; layanan aplikasi ada di profile "full".
#   make infra-up  -> hanya datastore (pengembangan native)
#   make docker-up -> semua layanan (--profile full)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # HANYA pengembangan lokal
    volumes:
      # Image PostgreSQL 18 menaruh PGDATA di /var/lib/postgresql/<mayor>/...;
      # pasang direktori INDUK, bukan /var/lib/postgresql/data.
      - postgres_data:/var/lib/postgresql
      - ./deploy/db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # UI web

  migrate:
    profiles: ["full"]
    build: { context: ., dockerfile: deploy/docker/backend.Dockerfile, target: dev }
    command: ["go", "run", "./backend/cmd/migrate", "up"]
    # Source harus dipasang: stage dev hanya berisi go.mod/go.sum (ADR-0003, perbaikan 15 §2.1).
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://app_user:app_dev_pw@postgres:5432/platform
      MIGRATION_DATABASE_URL: pgx5://app_migrator:migrator_dev_pw@postgres:5432/platform
    depends_on:
      postgres: { condition: service_healthy }

  api:
    profiles: ["full"]
    build: { context: ., dockerfile: deploy/docker/backend.Dockerfile, target: dev }
    command: ["air", "-c", ".air.api.toml"]
    volumes:
      - .:/app
      - /app/tmp                       # keluaran build air tetap di volume, bukan di working tree (milik root)
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    ports:
      - "127.0.0.1:8080:8080"
    env_file: .env
    environment:
      DATABASE_URL: postgres://app_user:app_dev_pw@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health/ready >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 120s # air mengompilasi + mengunduh modul saat pertama start (cache dingin)
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  worker:
    profiles: ["full"]
    build: { context: ., dockerfile: deploy/docker/backend.Dockerfile, target: dev }
    command: ["air", "-c", ".air.worker.toml"]
    volumes:
      - .:/app
      - /app/tmp                       # keluaran build air tetap di volume, bukan di working tree (milik root)
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/root/.cache/go-build
    env_file: .env
    environment:
      DATABASE_URL: postgres://app_user:app_dev_pw@postgres:5432/platform
      MAINTENANCE_DATABASE_URL: postgres://app_maintenance:maintenance_dev_pw@postgres:5432/platform
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    profiles: ["full"]
    build: { context: ., dockerfile: deploy/docker/web.Dockerfile, target: dev }
    command: ["npm", "run", "dev", "-w", "apps/web", "--", "--host"]
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules   # cache .vite tetap di volume, bukan di working tree (milik root)
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://api:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5173/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres_data:
  go_mod_cache:
  go_build_cache:
