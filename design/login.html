<!doctype html>
<html lang="id-ID" data-bs-theme="light" data-palette="aurora" data-nav="side">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="lg.title">Masuk</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/bootstrap-5.3.9/css/bootstrap.min.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="components.css">
  <script src="theme-init.js"></script>
</head>
<body data-states="normal,loading,validation,invalid,suspended,locked,rate,expired,error,success">
  <div class="z-auth">
    <aside class="z-banner">
      <a class="z-brand" href="#"><span class="z-logo" aria-hidden="true"></span><span class="z-brand-t" data-i18n="app.name">Zago</span></a>
      <div class="z-banner-body">
        <h2 class="display-6 fw-semibold" data-i18n="lg.banner.h">Platform modular, aman sejak awal.</h2>
        <p class="lead mb-0" data-i18n="lg.banner.p">Kelola peran, izin, dan kebijakan.</p>
      </div>
      <p class="small mb-0 d-none d-lg-block" data-i18n="lg.footer">Zago</p>
    </aside>
    <div class="z-auth-pane">
      <div class="z-auth-top">
        <label class="visually-hidden" for="lg-lang" data-i18n="user.lang">Bahasa</label>
        <select id="lg-lang" class="form-select form-select-sm w-auto" data-pref="lang" data-default="id-ID">
          <option value="id-ID">Indonesia</option><option value="en-US">English (US)</option>
        </select>
        <button class="z-icon-btn" type="button" data-action="toggle-mode" aria-label="Ganti mode" data-i18n-attr="aria-label:top.mode">
          <svg class="z-ic z-i-moon" aria-hidden="true"><use href="assets/icons.svg#moon-stars"/></svg><svg class="z-ic z-i-sun" aria-hidden="true"><use href="assets/icons.svg#sun"/></svg>
        </button>
      </div>
      <main class="z-auth-form" id="main">
        <h1 class="h3 mb-1" data-i18n="lg.title">Masuk</h1>
        <p class="text-body-secondary mb-4" data-i18n="lg.sub">Gunakan email dan password akun Anda.</p>
        <div id="login-alert" class="alert" hidden>
          <strong id="la-t" class="d-block"></strong><span id="la-m"></span>
          <span id="la-c" class="d-block fw-semibold mt-1" aria-hidden="true" hidden></span>
        </div>
        <form id="login-form" novalidate>
          <fieldset id="lg-fs" class="border-0 p-0 m-0">
            <div class="mb-3">
              <label for="lg-email" class="form-label" data-i18n="lg.email">Email</label>
              <input id="lg-email" name="email" type="email" class="form-control" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
              <div id="lg-email-e" class="invalid-feedback" data-i18n="lg.email.bad">Email tidak valid.</div>
            </div>
            <div class="mb-2">
              <label for="lg-password" class="form-label" data-i18n="lg.password">Password</label>
              <div class="input-group has-validation">
                <input id="lg-password" name="password" type="password" class="form-control" autocomplete="current-password" required>
                <button id="lg-toggle" type="button" class="btn btn-outline-secondary" data-action="toggle-pw" aria-controls="lg-password" aria-pressed="false" data-i18n="lg.show">Tampilkan</button>
                <div id="lg-password-e" class="invalid-feedback" data-i18n="lg.password.req">Masukkan password.</div>
              </div>
            </div>
            <div class="mb-4 text-end"><a class="small" href="forgot-password.html" data-i18n="lg.forgot">Lupa password?</a></div>
            <button id="login-submit" type="submit" class="btn btn-primary w-100 d-inline-flex justify-content-center align-items-center gap-2">
              <span id="lg-spin" class="spinner-border spinner-border-sm" aria-hidden="true" hidden></span><span id="lg-label" data-i18n="lg.submit">Masuk</span>
            </button>
          </fieldset>
        </form>
        <p class="small text-body-secondary mt-4 mb-0" data-i18n="lg.invite">Akses hanya melalui undangan.</p>
      </main>
    </div>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
  <script src="states.js"></script>
  <script src="login.js"></script>
</body>
</html>
