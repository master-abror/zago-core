# Hot reload Worker (docs/15). Dijalankan: go tool air -c .air.worker.toml
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/worker ./backend/cmd/worker"
  bin = "./tmp/worker"
  include_ext = ["go"]
  exclude_dir = ["tmp", "node_modules", "apps", "docs", "bin", "dist", "data"]
  delay = 500
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"
